name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer le projet
        run: |
          mkdir www assets
          cp index.html style.css app.js www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Muscu com.max.muscu --web-dir=www
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Compiler l'APK
        run: |
          cd android && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Muscu.apk
      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Muscu (dernière version)
          files: Muscu.apk
          make_latest: true
